[build]
  command = "yarn workspace @mytutorapp/web build"
  publish = "apps/web/dist"

# Proxy Firebase auth handler on your domain (only needed for redirect flows)
[[redirects]]
  from   = "/__/auth/*"
  to     = "https://mytutorapp-d3c91.firebaseapp.com/__/auth/:splat"
  status = 200
  force  = true

# API proxy
[[redirects]]
  from   = "/api/*"
  to     = "https://server.daybreaklearner.com/api/:splat"
  status = 200
  force  = true

# Canonical redirect: apex -> www (or remove and use Netlify UI)
[[redirects]]
  from   = "https://daybreaklearner.com/*"
  to     = "https://www.daybreaklearner.com/:splat"
  status = 301
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  VITE_BACKEND_URL          = "https://server.daybreaklearner.com"
  VITE_FIREBASE_AUTH_DOMAIN = "mytutorapp-d3c91.firebaseapp.com"
  VITE_DEBUG_ERRORS         = "1"
