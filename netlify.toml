# -----------------------------------------------------------------------------
# Core proxies (work for BOTH Next + proxied app pages)
# -----------------------------------------------------------------------------

# Proxy Firebase auth handler on your domain (only needed for redirect flows)
[[redirects]]
  from   = "/__/auth/*"
  to     = "https://mytutorapp-d3c91.firebaseapp.com/__/auth/:splat"
  status = 200
  force  = true

# API proxy
[[redirects]]
  from   = "/api/*"
  to     = "https://server.daybreaklearner.com/api/:splat"
  status = 200
  force  = true

# Canonical redirect: apex -> www (optional if handled in Netlify UI)
[[redirects]]
  from   = "https://daybreaklearner.com/*"
  to     = "https://www.daybreaklearner.com/:splat"
  status = 301
  force  = true

# -----------------------------------------------------------------------------
# Legacy Vite app routing (mounted under /app/* on www)
#
# IMPORTANT:
# When VITE_BRIDGED=0 on app.daybreaklearner.com, its built assets are /assets/*
# (NOT /app/assets/*). So we must proxy /assets/* too, otherwise Next will return
# HTML and the browser throws the "module script ... MIME type text/html" error.
# -----------------------------------------------------------------------------

# Normalize /app -> /app/
[[redirects]]
  from   = "/app"
  to     = "/app/"
  status = 301
  force  = true

# ✅ Proxy legacy app assets (Vite build base "/")
[[redirects]]
  from   = "/assets/*"
  to     = "https://app.daybreaklearner.com/assets/:splat"
  status = 200
  force  = true

# ✅ Proxy legacy app pages
[[redirects]]
  from   = "/app/*"
  to     = "https://app.daybreaklearner.com/:splat"
  status = 200
  force  = true

# -----------------------------------------------------------------------------
# NOTE:
# We intentionally DO NOT add a global "/* -> /index.html" SPA fallback.
# Next.js handles routing for all public pages on www.
# -----------------------------------------------------------------------------

[context.production.environment]
  NEXT_PUBLIC_SITE_URL            = "https://www.daybreaklearner.com"
  NEXT_PUBLIC_BACKEND_URL         = "https://server.daybreaklearner.com"
  # For web-next, this should point to the canonical legacy app origin:
  NEXT_PUBLIC_APP_ORIGIN          = "https://app.daybreaklearner.com"
  # Optional (set later):
  # NEXT_PUBLIC_GA4_MEASUREMENT_ID = "G-XXXXXXXXXX"
