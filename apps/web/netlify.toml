[build]
  command = "yarn workspace @mytutorapp/web build"
  publish = "apps/web/dist"

# 1) Serve built assets for the Vite app
[[redirects]]
  from = "/app/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# 2) SPA fallback (all /app routes should serve the SAME dist/index.html)
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200
  force = true
