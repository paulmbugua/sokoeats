[build]
  command = "yarn workspace @mytutorapp/web build"
  publish = "apps/web/dist"

  # ✅ Build ONLY if apps/web or shared packages changed
  # Netlify: exit 0 => build, exit 1 => skip build
  ignore = "git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" | grep -qE '^(apps/web/|packages/shared/)' && exit 1 || exit 0"

[context.production.environment]
  # ✅ Force legacy app build base "/" on the app subdomain
  VITE_BRIDGED = "0"

# -----------------------------------------------------------------------------
# OPTIONAL (recommended): ensure auth happens only on www
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/login"
  to = "https://www.daybreaklearner.com/login"
  status = 301
  force = true

[[redirects]]
  from = "/signup"
  to = "https://www.daybreaklearner.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "/org/login"
  to = "https://www.daybreaklearner.com/institutions"
  status = 301
  force = true

# ✅ Serve static assets as files (avoid any accidental SPA rewrite)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# ✅ SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200