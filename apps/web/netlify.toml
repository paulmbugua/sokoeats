[build]
  command = "yarn workspace @mytutorapp/web build"
  publish = "apps/web/dist"

  # ✅ Build ONLY if apps/web or shared packages changed
  # Netlify: exit 0 => build, exit 1 => skip build
  ignore = "git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" | grep -qE '^(apps/web/|packages/shared/)' && exit 1 || exit 0"

[context.production.environment]
  # ✅ Force legacy app build base "/" on the app subdomain
  VITE_BRIDGED = "0"

# -----------------------------------------------------------------------------
# ✅ CRITICAL: remove all auth UI from app.daybreaklearner.com
# Any auth-like route must permanently redirect to www.daybreaklearner.com
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/login"
  to = "https://www.daybreaklearner.com/login"
  status = 301
  force = true

[[redirects]]
  from = "/signup"
  to = "https://www.daybreaklearner.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "/register"
  to = "https://www.daybreaklearner.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "/sign-up"
  to = "https://www.daybreaklearner.com/signup"
  status = 301
  force = true

[[redirects]]
  from = "/sign-in"
  to = "https://www.daybreaklearner.com/login"
  status = 301
  force = true

[[redirects]]
  from = "/org/login"
  to = "https://www.daybreaklearner.com/institutions"
  status = 301
  force = true

[[redirects]]
  from = "/institutions/login"
  to = "https://www.daybreaklearner.com/institutions"
  status = 301
  force = true

# Optional catch-all for auth paths (kept narrow to avoid breaking app routes)
[[redirects]]
  from = "/auth/*"
  to = "https://www.daybreaklearner.com/login"
  status = 301
  force = true

# -----------------------------------------------------------------------------
# Static assets (avoid SPA fallback catching these)
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# -----------------------------------------------------------------------------
# ✅ SPA fallback (MUST be last)
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200