[build]
  command = "yarn workspace @mytutorapp/admin build"
  publish = "dist"

  # ✅ Skip build unless admin or shared changed
  ignore = "git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" | grep -E '^(apps/admin/|packages/shared/)' >/dev/null && exit 1 || exit 0"

# ✅ SPA fallback for Vite/React admin app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
