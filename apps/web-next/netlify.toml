[build]
  command = "yarn workspace @mytutorapp/web-next build"
  publish = ".next"

  # ✅ Skip build unless web-next or shared packages changed
  # Netlify: exit 0 => build, exit 1 => skip build
  ignore = "git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" | grep -qE '^(apps/web-next/|packages/shared/)' && exit 1 || exit 0"

# -----------------------------------------------------------------------------
# Core proxies (needed on www)
# -----------------------------------------------------------------------------

[[redirects]]
  from   = "/__/auth/*"
  to     = "https://mytutorapp-d3c91.firebaseapp.com/__/auth/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/*"
  to     = "https://server.daybreaklearner.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "https://daybreaklearner.com/*"
  to     = "https://www.daybreaklearner.com/:splat"
  status = 301
  force  = true

# -----------------------------------------------------------------------------
# ✅ CRITICAL: Phishing-suspension hardening
# Make legacy Google Ads /app/* entry URLs redirect to safe public pages
# (single-hop, same-domain, NOT login-first, NOT to app.daybreaklearner.com)
# -----------------------------------------------------------------------------

[[redirects]]
  from   = "/app/find-tutor"
  to     = "/find-tutor"
  status = 301
  force  = true

[[redirects]]
  from   = "/app/resources"
  to     = "/resources"
  status = 301
  force  = true

[[redirects]]
  from   = "/app/org/login"
  to     = "/institutions"
  status = 301
  force  = true

# Optional safety for trailing slash variants
[[redirects]]
  from   = "/app/find-tutor/"
  to     = "/find-tutor"
  status = 301
  force  = true

[[redirects]]
  from   = "/app/resources/"
  to     = "/resources"
  status = 301
  force  = true

[[redirects]]
  from   = "/app/org/login/"
  to     = "/institutions"
  status = 301
  force  = true

# -----------------------------------------------------------------------------
# Legacy Vite app proxy under /app/*
# (legacy app is built with base "/" on app.daybreaklearner.com)
# -----------------------------------------------------------------------------

[[redirects]]
  from   = "/app"
  to     = "/app/"
  status = 301
  force  = true

# ✅ assets are /assets/* in legacy build (VITE_BRIDGED=0)
[[redirects]]
  from   = "/assets/*"
  to     = "https://app.daybreaklearner.com/assets/:splat"
  status = 200
  force  = true

# ✅ pages under /app/*
# NOTE: keep this BELOW the hardening redirects above so they win.
[[redirects]]
  from   = "/app/*"
  to     = "https://app.daybreaklearner.com/:splat"
  status = 200
  force  = true

[context.production.environment]
  NEXT_PUBLIC_SITE_URL    = "https://www.daybreaklearner.com"
  NEXT_PUBLIC_BACKEND_URL = "https://server.daybreaklearner.com"
  NEXT_PUBLIC_APP_ORIGIN  = "https://app.daybreaklearner.com"
  # NEXT_PUBLIC_GA4_MEASUREMENT_ID = "G-XXXXXXXXXX"